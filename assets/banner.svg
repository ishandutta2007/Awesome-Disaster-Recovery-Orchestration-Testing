<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1936"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162347" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e1833" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #00F2FE;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #E2E8F0;
    }
    .node-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #38ef7d;
      font-weight: 600;
    }

    /* Dynamic CSS animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.6; }
    }
    @keyframes pulseRing {
      0% { r: 18px; opacity: 0.8; stroke-width: 2px; }
      50% { r: 32px; opacity: 0.2; stroke-width: 1px; }
      100% { r: 18px; opacity: 0.8; stroke-width: 2px; }
    }
    @keyframes dashStream {
      from { stroke-dashoffset: 60; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes spinRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulsing-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1050px 300px;
    }
    .ring-anim {
      animation: pulseRing 3.5s ease-out infinite;
    }
    .dash-line {
      stroke-dasharray: 6 6;
      animation: dashStream 2s linear infinite;
    }
    .floating-box {
      animation: floatCard 5s ease-in-out infinite;
    }
    .rotating-radar {
      animation: spinRadar 12s linear infinite;
      transform-origin: 1060px 140px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Dynamic Ambient Orbs in Background -->
  <circle class="pulsing-orb-1" cx="200" cy="100" r="140" fill="#00F2FE" filter="url(#orbGlow)"/>
  <circle class="pulsing-orb-2" cx="1050" cy="300" r="160" fill="#3b82f6" filter="url(#orbGlow)"/>

  <!-- Cyber Grid Pattern (Subtle) -->
  <g opacity="0.12">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#00F2FE" stroke-width="1"/>
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#00F2FE" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#00F2FE" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#00F2FE" stroke-width="1"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#00F2FE" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke="#00F2FE" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke="#00F2FE" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="#00F2FE" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="420" stroke="#00F2FE" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="420" stroke="#00F2FE" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated Architecture / Orchestration Stream on the Right Side -->
  <g id="orchestration-diagram" opacity="0.9">
    <!-- Connecting Stream Lines -->
    <path class="dash-line" d="M 860 140 L 970 140" fill="none" stroke="#00F2FE" stroke-width="2.5"/>
    <path class="dash-line" d="M 1030 140 L 1100 140" fill="none" stroke="#38ef7d" stroke-width="2.5"/>
    <path class="dash-line" d="M 1000 170 L 1000 240" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <path class="dash-line" d="M 1000 280 L 1080 320" fill="none" stroke="#38ef7d" stroke-width="2.5"/>
    <path class="dash-line" d="M 970 320 L 880 320" fill="none" stroke="#f43f5e" stroke-width="2.5"/>

    <!-- Dynamic Pulse Rings on Recovery Nodes -->
    <circle class="ring-anim" cx="1000" cy="140" r="20" fill="none" stroke="#00F2FE"/>
    <circle class="ring-anim" cx="1080" cy="320" r="20" fill="none" stroke="#38ef7d" style="animation-delay: 1.5s;"/>

    <!-- Failover Simulation Radar -->
    <g class="rotating-radar" opacity="0.25">
      <circle cx="1060" cy="140" r="55" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="8 8"/>
      <line x1="1060" y1="140" x2="1115" y2="140" stroke="#00F2FE" stroke-width="2"/>
    </g>

    <!-- Node 1: Primary DC -->
    <g class="floating-box" style="animation-delay: 0s;">
      <rect x="760" y="115" width="100" height="50" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="810" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#93c5fd" font-weight="700">PRIMARY</text>
      <text x="810" y="153" text-anchor="middle" class="node-text" fill="#38ef7d">PROD ACTIVE</text>
    </g>

    <!-- Node 2: DR Orchestrator Engine -->
    <g class="floating-box" style="animation-delay: 1.2s;">
      <rect x="950" y="115" width="105" height="50" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)"/>
      <text x="1002" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c7d2fe" font-weight="700">ORCHESTRATOR</text>
      <text x="1002" y="152" text-anchor="middle" font-family="monospace" font-size="10" fill="#38ef7d">RTO &lt; 15m</text>
    </g>

    <!-- Node 3: Standby Region / Failover Target -->
    <g class="floating-box" style="animation-delay: 2.5s;">
      <rect x="1030" y="295" width="115" height="50" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
      <text x="1087" y="318" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a7f3d0" font-weight="700">FAILOVER AZ</text>
      <text x="1087" y="333" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399">SYNCED (RPO 0)</text>
    </g>

    <!-- Node 4: Chaos Drill Validation -->
    <g class="floating-box" style="animation-delay: 1.8s;">
      <rect x="760" y="295" width="120" height="50" rx="8" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="820" y="318" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fda4af" font-weight="700">CHAOS TESTING</text>
      <text x="820" y="333" text-anchor="middle" font-family="monospace" font-size="10" fill="#fb7185">VERDICT: MET</text>
    </g>
  </g>

  <!-- Foreground Content: Unobstructed Title, Badges, and Tagline -->
  <g transform="translate(60, 0)">
    <!-- Category Mini-Pill -->
    <g transform="translate(0, 52)">
      <rect width="260" height="30" rx="15" fill="#0f2b48" stroke="#00F2FE" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#38ef7d" filter="url(#glow)"/>
      <text x="28" y="20" class="badge-text" fill="#E0F2FE">DISASTER RECOVERY ECOSYSTEM</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="132" class="title">
      Awesome Disaster Recovery
    </text>
    <text x="0" y="178" class="title" fill="url(#primaryGrad)">
      Orchestration &amp; Testing
    </text>

    <!-- Subtitle -->
    <text x="0" y="222" class="subtitle">
      Automated Failover • Runbook Automation • Chaos Validation
    </text>

    <!-- Descriptive Tagline -->
    <text x="0" y="258" class="tagline">
      A curated collection of production-grade SaaS platforms, cloud-native DR tools,
    </text>
    <text x="0" y="280" class="tagline">
      and open-source frameworks to turn recovery plans into provable, testable contracts.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 318)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="118" height="34" rx="8" fill="#13203c" stroke="#334155" stroke-width="1"/>
        <text x="59" y="21" text-anchor="middle" class="badge-text">⚡ DR Drills</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(128, 0)">
        <rect width="142" height="34" rx="8" fill="#13203c" stroke="#334155" stroke-width="1"/>
        <text x="71" y="21" text-anchor="middle" class="badge-text">🛡️ RTO / RPO Proof</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(280, 0)">
        <rect width="138" height="34" rx="8" fill="#13203c" stroke="#334155" stroke-width="1"/>
        <text x="69" y="21" text-anchor="middle" class="badge-text">☸️ Kubernetes DR</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(428, 0)">
        <rect width="154" height="34" rx="8" fill="#13203c" stroke="#334155" stroke-width="1"/>
        <text x="77" y="21" text-anchor="middle" class="badge-text">🔥 Chaos Engineering</text>
      </g>
    </g>
  </g>
</svg>
